name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: |
          uvx ruff@0.16.9 check .
          uvx ruff@0.16.9 format --check .
      - name: pytest
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  # Contrato do projeto: o grafo roda em replay sem nenhuma chave.
  # Placeholder até a SPEC-02 entregar `python -m app.cli run --limit 3`.
  replay:
    runs-on: ubuntu-latest
    steps:
      - run: echo "replay de três tickets entra com a SPEC-02"
